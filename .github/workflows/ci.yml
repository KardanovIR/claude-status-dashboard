name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  server:
    name: Server (build + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: agstatus_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/agstatus_test

  cli:
    name: CLI (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cli/package-lock.json
      # The CLI e2e suite imports the server sources and spawns dist/server.js.
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: cli
      - run: npx tsc --noEmit
        working-directory: cli
      - run: npx vitest run
        working-directory: cli

  hooks:
    name: Hook script (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck hooks/claude-status-hook.sh deploy/bootstrap-droplet.sh scripts/upload-ios-build.sh

  docker:
    name: Docker image (build only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false

  ios:
    name: iOS app (build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: >
          xcodebuild
          -project ios/AgStatus.xcodeproj
          -scheme AgStatus
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
