name: Deploy

# Every push to master deploys to the production droplet (agstatus.online).
# The droplet keeps a checkout at /opt/agstatus and rebuilds via docker
# compose; see deploy/bootstrap-droplet.sh for the one-time server setup.
#
# Required repo secret:
#   DEPLOY_SSH_KEY — private key whose public half is in the droplet's
#                    ~/.ssh/authorized_keys (deploy/bootstrap-droplet.sh
#                    installs it).

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_HOST: 137.184.69.118
  DEPLOY_USER: root
  DEPLOY_PATH: /opt/agstatus

jobs:
  deploy:
    name: Deploy to agstatus.online
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secret
        id: check
        run: |
          if [ -z "${{ secrets.DEPLOY_SSH_KEY }}" ]; then
            echo "DEPLOY_SSH_KEY secret not set — skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.check.outputs.enabled == 'true'
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy
        if: steps.check.outputs.enabled == 'true'
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" bash -s <<'EOF'
          set -euo pipefail
          cd /opt/agstatus
          git fetch origin master
          git reset --hard origin/master
          docker compose --profile tls up -d --build --remove-orphans
          docker image prune -f > /dev/null
          EOF

      - name: Verify
        if: steps.check.outputs.enabled == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "http://$DEPLOY_HOST:3000/healthz" > /dev/null 2>&1 \
               || curl -fsS --max-time 5 "https://agstatus.online/healthz" > /dev/null 2>&1; then
              echo "Health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after deploy." >&2
          exit 1
