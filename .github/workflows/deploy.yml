name: Deploy

# Every push to master deploys to production (agstatus.online) — a mini PC
# reached through a Cloudflare Tunnel, so there is no inbound SSH. Instead a
# self-hosted GitHub Actions runner on the machine itself (labels:
# self-hosted + agstatus) executes the deploy locally: the runner keeps a
# checkout at /apps/agstatus and rebuilds via docker compose.
#
# Runner setup (one-time, on the mini PC): repo Settings → Actions →
# Runners → New self-hosted runner, add the extra label "agstatus", then
# install it as a service so it survives reboots (./svc.sh install && start).

on:
  push:
    branches: [master]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /apps/agstatus

jobs:
  deploy:
    name: Deploy to agstatus.online
    runs-on: [self-hosted, agstatus]
    timeout-minutes: 20
    steps:
      - name: Deploy
        run: |
          set -euo pipefail
          cd "$DEPLOY_PATH"
          git fetch origin master
          git reset --hard origin/master
          docker compose --profile tunnel up -d --build --remove-orphans
          docker image prune -f > /dev/null

      - name: Verify
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 5 "http://localhost:3000/healthz" > /dev/null 2>&1 \
               && curl -fsS --max-time 5 "https://agstatus.online/healthz" > /dev/null 2>&1; then
              echo "Health check passed."
              exit 0
            fi
            sleep 5
          done
          echo "Health check failed after deploy." >&2
          exit 1
